name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name "PylandTweaks" --icon "assets\app.ico" --add-data "assets;assets" --add-data "Apariencia;Apariencia" --add-data "Recursos;Recursos" "Optimizador_GUI.py"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PylandTweaks.iss"'

      - name: Generate checksums
        run: |
          $lines = @()
          $lines += ((Get-FileHash "dist\PylandTweaks.exe" -Algorithm SHA256).Hash + "  PylandTweaks.exe")
          $lines += ((Get-FileHash "installer\Output\PylandTweaks_Setup_5.8.exe" -Algorithm SHA256).Hash + "  PylandTweaks_Setup_5.8.exe")
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PylandTweaks-5.8
          path: |
            dist/PylandTweaks.exe
            installer/Output/PylandTweaks_Setup_5.8.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PylandTweaks.exe
            installer/Output/PylandTweaks_Setup_5.8.exe
            SHA256SUMS.txt
